openapi: 3.0.3
info:
  title: Skeleton Fullstack API (Copilot)
  version: 1.0.0
  description: >
    Especificacion OpenAPI mantenida manualmente para la gestion de usuarios y la
    operativa diaria de la guarderia. Los usuarios operativos se autentican con su
    email y contraseña; se conserva el usuario legado admin para pruebas.
servers:
  - url: http://localhost:8080
security:
  - basicAuth: []
tags:
  - name: Users
    description: Operaciones de gestion de usuarios.
  - name: Operativa diaria
    description: Consultas y registros diarios de reservas.
  - name: Recepcion
    description: Consultas, disponibilidad y reservas del centro del usuario autenticado.
  - name: Tutores
    description: Búsqueda y mantenimiento de fichas de tutores del centro autorizado.
  - name: Perros
    description: Búsqueda y mantenimiento de fichas básicas de perros del centro autorizado.
paths:
  /api/recepcion/tutores:
    get:
      security:
        - basicAuth: []
      tags: [Tutores]
      summary: Busca tutores del centro autorizado
      description: >
        Recepcionista, Admin y Gerente pueden consultar únicamente los tutores
        de su centro. La búsqueda contempla nombre, apellidos, DNI, teléfono y email.
      operationId: listReceptionTutors
      parameters:
        - in: query
          name: search
          required: false
          description: Texto de búsqueda opcional.
          schema:
            type: string
            maxLength: 254
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: size
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Página de tutores ordenada por nombre, apellidos e identificador.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TutorPageDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      security:
        - basicAuth: []
      tags: [Tutores]
      summary: Registra un tutor en el centro autorizado
      description: No crea cuentas de usuario ni modifica otras relaciones.
      operationId: createReceptionTutor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TutorCreateRequestDto'
      responses:
        '201':
          description: Tutor creado.
          headers:
            Location:
              description: Ruta de la ficha creada.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TutorDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/recepcion/tutores/{id}:
    parameters:
      - in: path
        name: id
        required: true
        description: Identificador del tutor dentro del centro autorizado.
        schema:
          type: integer
          format: int64
          minimum: 0
    get:
      security:
        - basicAuth: []
      tags: [Tutores]
      summary: Consulta la ficha de un tutor
      description: Una ficha de otro centro se responde como no encontrada.
      operationId: getReceptionTutor
      responses:
        '200':
          description: Ficha del tutor. ETag permite detectar cambios desde la lectura.
          headers:
            ETag:
              description: Versión calculada con los datos actuales de la ficha.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TutorDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      security:
        - basicAuth: []
      tags: [Tutores]
      summary: Actualiza los datos permitidos de un tutor
      description: Requiere el ETag obtenido al consultar la ficha. Las coincidencias de contacto pueden confirmarse explícitamente.
      operationId: updateReceptionTutor
      parameters:
        - in: header
          name: If-Match
          required: true
          description: ETag de la ficha leída antes de editar.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TutorUpdateRequestDto'
      responses:
        '200':
          description: Tutor actualizado. Devuelve el nuevo ETag.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TutorDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/recepcion/perros:
    get:
      security:
        - basicAuth: []
      tags: [Perros]
      summary: Busca perros del centro autorizado
      description: >
        Recepcionista, Admin y Gerente pueden buscar por nombre del perro o del tutor.
        La respuesta incluye el tutor solo cuando pertenece al mismo centro del perro.
      operationId: listReceptionDogs
      parameters:
        - in: query
          name: search
          required: false
          description: Texto opcional para buscar por perro o tutor.
          schema:
            type: string
            maxLength: 254
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: size
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - in: query
          name: reservationCandidates
          required: false
          description: Limita la búsqueda a perros activos con tutor del mismo centro.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Página ordenada por nombre e identificador.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DogPageDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      security:
        - basicAuth: []
      tags: [Perros]
      summary: Registra un perro asociado a un tutor existente
      description: >
        El centro se obtiene de la sesión. El tutor debe pertenecer a ese centro.
        Una coincidencia de nombre y tutor requiere confirmación explícita. No se
        crean tutores ni se modifican datos de cuidados.
      operationId: createReceptionDog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DogCreateRequestDto'
      responses:
        '201':
          description: Perro creado.
          headers:
            Location:
              description: Ruta de la ficha creada.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DogDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/recepcion/perros/{id}:
    parameters:
      - in: path
        name: id
        required: true
        description: Identificador del perro dentro del centro autorizado.
        schema:
          type: integer
          format: int64
          minimum: 0
    get:
      security:
        - basicAuth: []
      tags: [Perros]
      summary: Consulta la ficha de un perro
      description: Una ficha de otro centro se responde como no encontrada.
      operationId: getReceptionDog
      responses:
        '200':
          description: Ficha del perro y ETag para detectar cambios desde la lectura.
          headers:
            ETag:
              description: Versión calculada con los datos básicos editables y su tutor.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DogDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      security:
        - basicAuth: []
      tags: [Perros]
      summary: Actualiza los datos básicos permitidos de un perro
      description: >
        Requiere el ETag obtenido al consultar la ficha. Tutor y centro no son
        editables. Los campos opcionales omitidos se conservan; para vaciarlos,
        usa clearBreed o clearBirthDate. Los demás campos de la entidad permanecen intactos.
      operationId: updateReceptionDog
      parameters:
        - in: header
          name: If-Match
          required: true
          description: ETag de la ficha leída antes de editar.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DogUpdateRequestDto'
      responses:
        '200':
          description: Perro actualizado. Devuelve el nuevo ETag.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DogDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/recepcion/grupos:
    get:
      security:
        - basicAuth: []
      tags: [Recepcion]
      summary: Lista los grupos disponibles para reserva
      description: >
        Recepcionista, Admin y Gerente pueden consultar grupos de su centro.
        No hay asignación automática; el grupo debe elegirse en el alta.
      operationId: listReceptionGroups
      responses:
        '200':
          description: Grupos ordenados por nombre, con su capacidad por franja.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReceptionGroupOptionDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/recepcion/disponibilidad:
    get:
      security:
        - basicAuth: []
      tags: [Recepcion]
      summary: Consulta disponibilidad informativa de un grupo
      description: >
        Devuelve plazas restantes por franja. El alta vuelve a comprobar el aforo
        de forma transaccional. Solo permite hoy o fechas futuras de lunes a sábado.
      operationId: getReceptionAvailability
      parameters:
        - in: query
          name: date
          required: true
          description: Fecha consultada en la zona horaria Europe/Madrid.
          schema:
            type: string
            format: date
            pattern: '^\d{4}-\d{2}-\d{2}$'
            example: '2026-11-18'
        - in: query
          name: groupId
          required: true
          description: Grupo del centro autorizado seleccionado por recepción.
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        '200':
          description: Capacidad, ocupación y plazas restantes por franja.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceptionAvailabilityDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/recepcion/reservas:
    get:
      security:
        - basicAuth: []
      tags: [Recepcion]
      summary: Lista reservas de una fecha para recepción
      description: >
        Solo Recepcionista, Admin y Gerente. El centro se obtiene del usuario autenticado;
        no se admite seleccionar otro centro. Si se omite la fecha, se usa hoy en Europe/Madrid.
        Incluye reservas canceladas y una situación de presencia calculada desde check_registro.
      operationId: listReceptionReservations
      parameters:
        - in: query
          name: date
          required: false
          description: Fecha consultada; por defecto, hoy en Europe/Madrid.
          schema:
            type: string
            format: date
            pattern: '^\d{4}-\d{2}-\d{2}$'
            example: '2026-11-17'
        - in: query
          name: page
          required: false
          description: Índice de página empezando en cero.
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: size
          required: false
          description: Número de resultados por página.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Página de reservas ordenada por nombre del perro e identificador.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceptionReservationPageDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      security:
        - basicAuth: []
      tags: [Recepcion]
      summary: Crea una reserva confirmada
      description: >
        Solo Recepcionista, Admin y Gerente. El centro y tutor se derivan del usuario
        y perro autenticados. Requiere un perro activo con tutor del centro y un grupo
        elegido expresamente. No acepta estado, bono, centro ni ocupación.
        La unicidad activa por perro/fecha y el aforo se validan dentro de una transacción.
      operationId: createReceptionReservation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReceptionReservationRequestDto'
      responses:
        '201':
          description: Reserva confirmada y persistida.
          headers:
            Location:
              description: Ruta del detalle de la reserva creada.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceptionBookingCreatedDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/recepcion/reservas/{id}:
    get:
      security:
        - basicAuth: []
      tags: [Recepcion]
      summary: Consulta el detalle de una reserva
      description: >
        Solo Recepcionista, Admin y Gerente. Una reserva inexistente o perteneciente
        a otro centro responde igual para no revelar su existencia.
      operationId: getReceptionReservation
      parameters:
        - in: path
          name: id
          required: true
          description: Identificador de la reserva, incluido el valor cero si lo asigna la base de datos.
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        '200':
          description: Datos básicos de reserva, perro, contacto del tutor y presencia registrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceptionReservationDetailDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/reservas:
    get:
      security:
        - basicAuth: []
      tags: [Operativa diaria]
      summary: Lista las reservas de una fecha
      description: >
        Devuelve solo reservas del centro asociado al usuario autenticado.
        Solo Recepcionista, Admin y Gerente. Si no se indica fecha, se usa la fecha actual.
      operationId: listDailyReservations
      parameters:
        - in: query
          name: date
          required: false
          description: Fecha de las reservas; por defecto, hoy.
          schema:
            type: string
            format: date
            example: '2026-11-17'
        - in: query
          name: groupId
          required: false
          description: Filtra las reservas por identificador de grupo.
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Reservas con ficha del perro, alergias, medicación, incompatibilidades y ocupación.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReservationDayDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/reservas/{id}/check-registros:
    parameters:
      - in: path
        name: id
        required: true
        description: Identificador de la reserva.
        schema:
          type: integer
          format: int64
          minimum: 1
    post:
      security:
        - basicAuth: []
      tags: [Operativa diaria]
      summary: Registra la entrada o salida de una reserva
      operationId: createCheckRecord
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckRecordRequestDto'
      responses:
        '201':
          description: Registro de entrada o salida creado; se devuelve el nuevo estado de la reserva.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckRecordDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/reservas/{id}/registros-diarios:
    parameters:
      - in: path
        name: id
        required: true
        description: Identificador de la reserva.
        schema:
          type: integer
          format: int64
          minimum: 1
    post:
      security:
        - basicAuth: []
      tags: [Operativa diaria]
      summary: Registra una actividad diaria
      operationId: createDailyRecord
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DailyRecordRequestDto'
      responses:
        '201':
          description: Registro diario creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyRecordDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/reservas/{id}/incidencias:
    parameters:
      - in: path
        name: id
        required: true
        description: Identificador de la reserva.
        schema:
          type: integer
          format: int64
          minimum: 1
    post:
      security:
        - basicAuth: []
      tags: [Operativa diaria]
      summary: Registra una incidencia de una reserva
      operationId: createReservationIncident
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncidentRequestDto'
      responses:
        '201':
          description: Incidencia creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/users:
    get:
      tags: [Users]
      summary: Lista todos los usuarios
      operationId: listUsers
      responses:
        '200':
          description: Lista de usuarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Users]
      summary: Crea un usuario
      operationId: createUser
      security:
        - basicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpsertRequestDto'
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/users/{id}:
    parameters:
      - in: path
        name: id
        required: true
        description: Identificador numerico del usuario.
        schema:
          type: integer
          format: int64
          minimum: 1
    get:
      tags: [Users]
      summary: Obtiene un usuario por id
      operationId: getUserById
      responses:
        '200':
          description: Usuario encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [Users]
      summary: Actualiza un usuario existente
      operationId: updateUser
      security:
        - basicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpsertRequestDto'
      responses:
        '200':
          description: Usuario actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Users]
      summary: Elimina un usuario
      operationId: deleteUser
      security:
        - basicAuth: []
      responses:
        '204':
          description: Usuario eliminado correctamente
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
  responses:
    BadRequest:
      description: Solicitud invalida por datos o formato incorrecto.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Credenciales ausentes o invalidas.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: El usuario autenticado no dispone de permisos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Recurso solicitado no encontrado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflicto de negocio (estado incompatible o recurso duplicado).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: Error de validacion semantica en la solicitud.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Error interno no controlado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    DogDto:
      type: object
      required: [id, name, size, tutorId, tutorName, tutorNationalId]
      properties:
        id:
          type: integer
          format: int64
          minimum: 0
        name:
          type: string
          minLength: 1
          maxLength: 120
        breed:
          type: string
          nullable: true
          maxLength: 120
        size:
          type: string
          enum: [PEQUENO, MEDIANO, GRANDE]
        birthDate:
          type: string
          format: date
          nullable: true
        tutorId:
          type: integer
          format: int64
          nullable: true
          minimum: 0
        tutorName:
          type: string
          nullable: true
        tutorNationalId:
          type: string
          nullable: true
    DogPageDto:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DogDto'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    DogCreateRequestDto:
      type: object
      required: [tutorId, name, size]
      properties:
        tutorId:
          type: integer
          format: int64
          minimum: 0
          description: Debe identificar un tutor del centro autenticado.
        name:
          type: string
          minLength: 1
          maxLength: 120
        breed:
          type: string
          nullable: true
          maxLength: 120
        size:
          type: string
          enum: [PEQUENO, MEDIANO, GRANDE]
        birthDate:
          type: string
          format: date
          nullable: true
          description: No puede ser una fecha futura.
        confirmMatches:
          type: boolean
          default: false
          description: Confirma continuar si el tutor ya tiene un perro con el mismo nombre.
    DogUpdateRequestDto:
      type: object
      required: [name, size]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        breed:
          type: string
          nullable: true
          maxLength: 120
          description: Si se omite, conserva la raza actual; null también se interpreta como conservar.
        size:
          type: string
          enum: [PEQUENO, MEDIANO, GRANDE]
        birthDate:
          type: string
          format: date
          nullable: true
          description: Si se omite, conserva la fecha actual; null también se interpreta como conservar.
        clearBreed:
          type: boolean
          default: false
          description: Si es true, vacía la raza; no puede combinarse con una raza no vacía.
        clearBirthDate:
          type: boolean
          default: false
          description: Si es true, vacía la fecha de nacimiento; no puede combinarse con una fecha.
        confirmMatches:
          type: boolean
          default: false
          description: Confirma continuar si hay otro perro con el mismo nombre y tutor.
    TutorDto:
      type: object
      required: [id, firstName, lastName, nationalId, phone, email]
      properties:
        id:
          type: integer
          format: int64
          minimum: 0
        firstName:
          type: string
          minLength: 1
          maxLength: 120
        lastName:
          type: string
          minLength: 1
          maxLength: 160
        nationalId:
          type: string
          minLength: 1
          maxLength: 20
        phone:
          type: string
          minLength: 1
          maxLength: 30
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
    TutorPageDto:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TutorDto'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    TutorCreateRequestDto:
      allOf:
        - $ref: '#/components/schemas/TutorFieldsRequestDto'
        - type: object
          required: [confirmMatches]
          properties:
            confirmMatches:
              type: boolean
              description: Confirma continuar si hay otro tutor con el mismo teléfono o email.
    TutorUpdateRequestDto:
      allOf:
        - $ref: '#/components/schemas/TutorFieldsRequestDto'
        - type: object
          required: [confirmMatches]
          properties:
            confirmMatches:
              type: boolean
              description: Confirma continuar si hay otro tutor con el mismo teléfono o email.
    TutorFieldsRequestDto:
      type: object
      required: [firstName, lastName, nationalId, phone, email]
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 120
        lastName:
          type: string
          minLength: 1
          maxLength: 160
        nationalId:
          type: string
          minLength: 1
          maxLength: 20
        phone:
          type: string
          minLength: 1
          maxLength: 30
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
    ReceptionReservationPageDto:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReceptionReservationDto'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    ReceptionReservationDto:
      type: object
      required: [id, date, modality, status, dogId, dogName, presenceStatus]
      properties:
        id:
          type: integer
          format: int64
          minimum: 0
        date:
          type: string
          format: date
        modality:
          type: string
          enum: [DIA_COMPLETO, MEDIA_JORNADA, MANANA, TARDE]
        status:
          type: string
          enum: [PENDIENTE, CONFIRMADA, EN_CURSO, COMPLETADA, CANCELADA]
        dogId:
          type: integer
          format: int64
          minimum: 0
        dogName:
          type: string
          maxLength: 120
        tutorName:
          type: string
          nullable: true
        presenceStatus:
          type: string
          enum: [SIN_ENTRADA_REGISTRADA, EN_EL_CENTRO, SALIDA_REGISTRADA, REGISTRO_INCOHERENTE]
    ReceptionReservationDetailDto:
      type: object
      required: [id, date, modality, status, dog, presence]
      properties:
        id:
          type: integer
          format: int64
          minimum: 0
        date:
          type: string
          format: date
        modality:
          type: string
          enum: [DIA_COMPLETO, MEDIA_JORNADA, MANANA, TARDE]
        status:
          type: string
          enum: [PENDIENTE, CONFIRMADA, EN_CURSO, COMPLETADA, CANCELADA]
        dog:
          $ref: '#/components/schemas/ReceptionDogDto'
        tutor:
          allOf:
            - $ref: '#/components/schemas/ReceptionTutorDto'
          nullable: true
        presence:
          $ref: '#/components/schemas/ReceptionPresenceDto'
    CreateReceptionReservationRequestDto:
      type: object
      required: [dogId, groupId, date, modality]
      additionalProperties: false
      properties:
        dogId:
          type: integer
          format: int64
          minimum: 0
        groupId:
          type: integer
          format: int64
          minimum: 0
        date:
          type: string
          format: date
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Hoy o fecha futura de lunes a sábado, según Europe/Madrid.
        modality:
          type: string
          enum: [DIA_COMPLETO, MANANA, TARDE]
    ReceptionGroupOptionDto:
      type: object
      required: [id, name, capacityPerSlot]
      properties:
        id:
          type: integer
          format: int64
          minimum: 0
        name:
          type: string
          maxLength: 120
        capacityPerSlot:
          type: integer
          minimum: 1
    ReceptionAvailabilityDto:
      type: object
      required:
        - date
        - groupId
        - groupName
        - capacityPerSlot
        - morningOccupied
        - morningRemaining
        - afternoonOccupied
        - afternoonRemaining
      properties:
        date:
          type: string
          format: date
        groupId:
          type: integer
          format: int64
          minimum: 0
        groupName:
          type: string
          maxLength: 120
        capacityPerSlot:
          type: integer
          minimum: 1
        morningOccupied:
          type: integer
          format: int64
          minimum: 0
        morningRemaining:
          type: integer
          format: int64
          minimum: 0
        afternoonOccupied:
          type: integer
          format: int64
          minimum: 0
        afternoonRemaining:
          type: integer
          format: int64
          minimum: 0
    ReceptionBookingCreatedDto:
      type: object
      required: [id, date, modality, status, dogId, dogName, groupId, groupName]
      properties:
        id:
          type: integer
          format: int64
          minimum: 0
        date:
          type: string
          format: date
        modality:
          type: string
          enum: [DIA_COMPLETO, MANANA, TARDE]
        status:
          type: string
          enum: [CONFIRMADA]
        dogId:
          type: integer
          format: int64
          minimum: 0
        dogName:
          type: string
          maxLength: 120
        groupId:
          type: integer
          format: int64
          minimum: 0
        groupName:
          type: string
          maxLength: 120
    ReceptionDogDto:
      type: object
      required: [id, name, size]
      properties:
        id:
          type: integer
          format: int64
          minimum: 0
        name:
          type: string
          maxLength: 120
        breed:
          type: string
          maxLength: 120
          nullable: true
        size:
          type: string
          enum: [PEQUENO, MEDIANO, GRANDE]
        birthDate:
          type: string
          format: date
          nullable: true
    ReceptionTutorDto:
      type: object
      required: [name, phone]
      properties:
        name:
          type: string
          maxLength: 281
        phone:
          type: string
          maxLength: 30
    ReceptionPresenceDto:
      type: object
      required: [status, inconsistent]
      properties:
        status:
          type: string
          enum: [SIN_ENTRADA_REGISTRADA, EN_EL_CENTRO, SALIDA_REGISTRADA, REGISTRO_INCOHERENTE]
        lastEntryAt:
          type: string
          format: date-time
          nullable: true
        entryPetCondition:
          type: string
          maxLength: 500
          nullable: true
        lastExitAt:
          type: string
          format: date-time
          nullable: true
        inconsistent:
          type: boolean
    ReservationDayDto:
      type: object
      required: [id, date, modality, status, dog]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        date:
          type: string
          format: date
        modality:
          type: string
          enum: [DIA_COMPLETO, MEDIA_JORNADA, MANANA, TARDE]
        status:
          type: string
          enum: [PENDIENTE, CONFIRMADA, EN_CURSO, COMPLETADA, CANCELADA]
        dog:
          $ref: '#/components/schemas/DogDailyDto'
        groupOccupancy:
          allOf:
            - $ref: '#/components/schemas/GroupOccupancyDto'
          nullable: true
    DogDailyDto:
      type: object
      required: [id, name, size, allergies, medications, incompatibilities]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
          maxLength: 120
        breed:
          type: string
          maxLength: 120
          nullable: true
        size:
          type: string
          enum: [PEQUENO, MEDIANO, GRANDE]
        birthDate:
          type: string
          format: date
          nullable: true
        allergies:
          type: array
          items:
            $ref: '#/components/schemas/AllergyDto'
        medications:
          type: array
          items:
            $ref: '#/components/schemas/MedicationDto'
        incompatibilities:
          type: array
          items:
            $ref: '#/components/schemas/IncompatibilityDto'
    AllergyDto:
      type: object
      required: [id, description]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        description:
          type: string
          maxLength: 1000
    MedicationDto:
      type: object
      required: [id, medication, instructions]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        medication:
          type: string
          maxLength: 160
        dosage:
          type: string
          maxLength: 255
          nullable: true
        instructions:
          type: string
          maxLength: 1000
    IncompatibilityDto:
      type: object
      required: [id, incompatibleDogId, incompatibleDogName]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        incompatibleDogId:
          type: integer
          format: int64
          minimum: 0
        incompatibleDogName:
          type: string
          maxLength: 120
        reason:
          type: string
          maxLength: 1000
          nullable: true
    GroupOccupancyDto:
      type: object
      required: [groupId, occupied, capacityMax]
      properties:
        groupId:
          type: integer
          format: int64
          minimum: 0
        occupied:
          type: integer
          format: int64
          minimum: 0
          description: Reservas del grupo y fecha cuyo estado no es CANCELADA.
        capacityMax:
          type: integer
          minimum: 1
    CheckRecordRequestDto:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [ENTRADA, SALIDA]
        petCondition:
          type: string
          maxLength: 500
          nullable: true
        observations:
          type: string
          maxLength: 2000
          nullable: true
          description: Artículos o indicaciones que deja el tutor.
    CheckRecordDto:
      type: object
      required: [id, reservationId, type, dateTime, reservationStatus]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        reservationId:
          type: integer
          format: int64
          minimum: 1
        type:
          type: string
          enum: [ENTRADA, SALIDA]
        dateTime:
          type: string
          format: date-time
        petCondition:
          type: string
          maxLength: 500
          nullable: true
        observations:
          type: string
          maxLength: 2000
          nullable: true
        reservationStatus:
          type: string
          enum: [PENDIENTE, CONFIRMADA, EN_CURSO, COMPLETADA, CANCELADA]
    DailyRecordRequestDto:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [COMIDA, PASEO, JUEGO, DESCANSO, OTRO]
        notes:
          type: string
          maxLength: 2000
          nullable: true
    DailyRecordDto:
      type: object
      required: [id, reservationId, type, dateTime]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        reservationId:
          type: integer
          format: int64
          minimum: 1
        type:
          type: string
          enum: [COMIDA, PASEO, JUEGO, DESCANSO, OTRO]
        dateTime:
          type: string
          format: date-time
        notes:
          type: string
          maxLength: 2000
          nullable: true
    IncidentRequestDto:
      type: object
      required: [severity, description]
      properties:
        severity:
          type: string
          enum: [LEVE, MODERADA, GRAVE]
        description:
          type: string
          minLength: 1
          maxLength: 2000
    IncidentDto:
      type: object
      required: [id, reservationId, severity, description, dateTime]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        reservationId:
          type: integer
          format: int64
          minimum: 1
        severity:
          type: string
          enum: [LEVE, MODERADA, GRAVE]
        description:
          type: string
          maxLength: 2000
        dateTime:
          type: string
          format: date-time
    UserDto:
      type: object
      required:
        - id
        - username
        - enabled
        - roles
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          example: 1
        username:
          type: string
          minLength: 1
          maxLength: 80
          example: admin
        enabled:
          type: boolean
          example: true
        roles:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: string
            minLength: 1
            maxLength: 80
            example: ROLE_ADMIN
    UserUpsertRequestDto:
      type: object
      required:
        - username
        - centerId
        - firstName
        - lastName
        - nationalId
        - email
        - password
        - enabled
        - roles
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 80
          description: Nombre de usuario. Se normaliza internamente a minusculas.
          example: manager
        centerId:
          type: integer
          format: int64
          minimum: 1
          description: Identificador del centro asociado.
        firstName:
          type: string
          minLength: 1
          maxLength: 120
        lastName:
          type: string
          minLength: 1
          maxLength: 160
        nationalId:
          type: string
          minLength: 1
          maxLength: 20
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 120
          format: password
          example: securePass123
        enabled:
          type: boolean
          example: true
        roles:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: string
            minLength: 1
            maxLength: 80
            description: Rol único del usuario; si lleva prefijo ROLE_ se elimina antes de almacenarlo.
            example: ADMIN
    ValidationErrorItem:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
          example: username
        message:
          type: string
          example: El nombre de usuario es obligatorio
    ErrorResponse:
      type: object
      required:
        - timestamp
        - status
        - error
        - message
      properties:
        timestamp:
          type: string
          format: date-time
          example: '2026-09-25T08:20:58Z'
        status:
          type: integer
          format: int32
          minimum: 100
          maximum: 599
          example: 400
        error:
          type: string
          example: Bad Request
        message:
          type: string
          example: El id debe ser mayor que cero
        code:
          type: string
          nullable: true
          description: Código funcional opcional para conflictos de reserva.
          enum: [DUPLICATE_RESERVATION, CAPACITY_FULL, CAPACITY_NOT_CONFIGURED, DATE_NOT_ALLOWED]
        errors:
          type: array
          description: Detalle opcional de errores de validacion por campo.
          items:
            $ref: '#/components/schemas/ValidationErrorItem'
