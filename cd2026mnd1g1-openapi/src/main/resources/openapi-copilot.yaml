      summary: Consulta el detalle de una reserva
      description: >
        Solo Recepcionista, Admin y Gerente. Una reserva inexistente o perteneciente
        a otro centro responde igual para no revelar su existencia.
      operationId: getReceptionReservation
      parameters:
        - in: path
          name: id
          required: true
          description: Identificador de la reserva, incluido el valor cero si lo asigna la base de datos.
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        '200':
          description: Datos básicos de reserva, perro, contacto del tutor y presencia registrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceptionReservationDetailDto'
        '400':
