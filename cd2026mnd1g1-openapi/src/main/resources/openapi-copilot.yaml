            minLength: 1
            maxLength: 80
            description: Rol único del usuario; si lleva prefijo ROLE_ se elimina antes de almacenarlo.
            example: ADMIN
    ValidationErrorItem:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
          example: username
        message:
          type: string
          example: El nombre de usuario es obligatorio
    ErrorResponse:
      type: object
      required:
        - timestamp
        - status
        - error
        - message
      properties:
        timestamp:
          type: string
          format: date-time
          example: '2026-09-25T08:20:58Z'
        status:
          type: integer
          format: int32
          minimum: 100
          maximum: 599
          example: 400
        error:
          type: string
          example: Bad Request
        message:
          type: string
          example: El id debe ser mayor que cero
        code:
          type: string
          nullable: true
          description: Código funcional opcional para conflictos de reserva o de configuración del portal.
          enum:
            - DUPLICATE_RESERVATION
            - CAPACITY_FULL
            - CAPACITY_NOT_CONFIGURED
            - DATE_NOT_ALLOWED
            - TUTOR_ACCOUNT_NOT_LINKED
            - TUTOR_ACCOUNT_INCONSISTENT
        errors:
          type: array
          description: Detalle opcional de errores de validacion por campo.
          items:
            $ref: '#/components/schemas/ValidationErrorItem'
