openapi: 3.0.3
info:
  title: Skeleton Fullstack API (Copilot)
  version: 1.0.0
  description: >
    Especificacion OpenAPI mantenida manualmente para la gestion de usuarios y la
    operativa diaria de la guarderia. Los usuarios operativos se autentican con su
    email y contraseña; se conserva el usuario legado admin para pruebas.
servers:
  - url: http://localhost:8080
security:
  - basicAuth: []
tags:
  - name: Users
    description: Operaciones de gestion de usuarios.
  - name: Operativa diaria
    description: Consultas y registros diarios de reservas.
  - name: Recepcion
    description: Consultas, disponibilidad y reservas del centro del usuario autenticado.
  - name: Tutores
    description: Búsqueda y mantenimiento de fichas de tutores del centro autorizado.
  - name: Perros
    description: Búsqueda y mantenimiento de fichas básicas de perros del centro autorizado.
paths:
  /api/users/me:
    get:
      tags: [Users]
      summary: Obtiene la identidad de la cuenta autenticada
      description: Devuelve el nombre de usuario y rol sin listar otras cuentas.
      operationId: getCurrentUser
      security:
        - basicAuth: []
      responses:
        '200':
          description: Identidad autenticada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/tutor/mis-perros:
    get:
      tags: [Tutors]
      summary: Lista los perros de la ficha vinculada al tutor autenticado
      description: >
        Requiere rol TUTOR. La cuenta se resuelve desde Basic Auth y la consulta
        limita los perros por tutor y centro; no acepta tutor_id ni centro_id.
        El orden es estable por nombre e identificador.
      operationId: listMyDogs
      security:
        - basicAuth: []
      parameters:
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: size
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Página de perros propios con campos mínimos de listado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TutorDogPageDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Tutors]
      summary: Registra un perro y datos asociados para el tutor autenticado
      description: >
        Obtiene tutor y centro desde la sesión; no acepta sus identificadores ni
        datos internos. Las pautas de alimentación y el temperamento son
        gestionados por el centro y no se reciben desde el portal. La operación
        de base de datos es transaccional. Las personas autorizadas quedan
        vinculadas al tutor para sus perros actuales y futuros. Requiere una
        clave UUID estable para proteger reintentos; repetir la misma clave y
        datos devuelve el resultado anterior sin crear otro registro.
      operationId: createMyDog
      security:
        - basicAuth: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          description: UUID nuevo por alta y reutilizado al reintentar la misma solicitud.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [request]
              properties:
                request:
                  $ref: '#/components/schemas/TutorDogCreateRequestDto'
                photo:
                  type: string
                  format: binary
                  description: Imagen JPEG o PNG opcional de hasta 5 MiB.
            encoding:
              request:
                contentType: application/json
      responses:
        '201':
          description: Perro y datos asociados creados.
          headers:
            Location:
              description: Ruta de la ficha creada.
              schema:
                type: string
            Idempotency-Replayed:
              description: No presente cuando es un alta nueva.
              schema:
                type: boolean
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TutorDogDetailDto'
        '200':
          description: Se devolvió el resultado persistido de un reintento idéntico.
          headers:
            Idempotency-Replayed:
              description: Indica que no se creó otro perro.
              schema:
                type: boolean
                enum: [true]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TutorDogDetailDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/tutor/mis-perros/personas-autorizadas:
    get:
      tags: [Tutors]
      summary: Lista las autorizaciones generales del tutor autenticado
      description: >
        Devuelve las personas autorizadas para recoger cualquiera de los perros
        actuales o futuros del tutor. La modificación y revocación se realiza
        dentro de la actualización versionada de una ficha propia.
      operationId: listMyAuthorizedPersons
      security:
        - basicAuth: []
      responses:
        '200':
          description: Personas autorizadas generales del tutor.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TutorAuthorizedPersonDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/tutor/mis-perros/{id}:
    parameters:
      - in: path
        name: id
        required: true
        description: Identificador del perro; solo se resuelven perros del tutor autenticado.
        schema:
          type: integer
          format: int64
          minimum: 0
    get:
      tags: [Tutors]
      summary: Consulta una ficha propia en modo lectura
      description: >
        Excluye el temperamento, datos internos, peso, incidencias y relaciones
        de terceros. La alimentación se devuelve solo como información de consulta.
      operationId: getMyDog
      security:
        - basicAuth: []
      responses:
        '200':
          description: Ficha con los campos permitidos para el tutor.
          headers:
            ETag:
              description: Versión para la actualización condicional.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TutorDogDetailDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [Tutors]
      summary: Actualiza los campos editables de un perro propio
      description: >
        Obtiene tutor y centro desde la sesión y bloquea la ficha para evitar
        escrituras concurrentes. Solo actualiza datos básicos, alergias y
        medicación declaradas por el tutor, foto y autorizaciones generales del
        tutor. La alimentación es de solo lectura y el temperamento no se
        expone en este portal. Los registros de cuidados creados por recepción
        se conservan. La lista completa de autorizaciones es obligatoria: las
        filas con ID se actualizan, las filas sin ID se crean y las omitidas se
        revocan lógicamente. La operación de base de datos es transaccional; la
        gestión del archivo de foto se compensa por separado.
      operationId: updateMyDog
      security:
        - basicAuth: []
      parameters:
        - in: header
          name: If-Match
          required: true
          description: ETag recibido al consultar la ficha.
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [request]
              properties:
                request:
                  $ref: '#/components/schemas/TutorDogUpdateRequestDto'
                photo:
                  type: string
                  format: binary
                  description: Nueva imagen JPEG o PNG de hasta 5 MiB; opcional.
            encoding:
              request:
                contentType: application/json
      responses:
        '200':
          description: Ficha actualizada.
          headers:
            ETag:
              description: Nueva versión de la ficha.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TutorDogDetailDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/tutor/mis-perros/{id}/foto:
    parameters:
      - in: path
        name: id
        required: true
        description: Identificador del perro; la autorización se vuelve a comprobar.
        schema:
          type: integer
          format: int64
          minimum: 0
    get:
      tags: [Tutors]
      summary: Sirve la foto local privada de un perro propio
      description: >
        Solo admite nombres de archivo locales desde DOG_PHOTOS_DIR. No descarga
        URLs, no expone rutas del servidor y no publica el directorio.
      operationId: getMyDogPhoto
      security:
        - basicAuth: []
      responses:
        '200':
          description: Foto accesible del perro propio.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/recepcion/tutores:
    get:
      security:
        - basicAuth: []
      tags: [Tutores]
      summary: Busca tutores del centro autorizado
      description: >
        Recepcionista, Admin y Gerente pueden consultar únicamente los tutores
        de su centro. La búsqueda contempla nombre, apellidos, DNI, teléfono y email.
      operationId: listReceptionTutors
      parameters:
        - in: query
          name: search
          required: false
          description: Texto de búsqueda opcional.
          schema:
            type: string
            maxLength: 254
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: size
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Página de tutores ordenada por nombre, apellidos e identificador.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TutorPageDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      security:
        - basicAuth: []
      tags: [Tutores]
      summary: Registra un tutor en el centro autorizado
      description: No crea cuentas de usuario ni modifica otras relaciones.
      operationId: createReceptionTutor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TutorCreateRequestDto'
      responses:
        '201':
          description: Tutor creado.
          headers:
            Location:
              description: Ruta de la ficha creada.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TutorDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/recepcion/tutores/{id}:
    parameters:
      - in: path
        name: id
        required: true
        description: Identificador del tutor dentro del centro autorizado.
        schema:
          type: integer
          format: int64
          minimum: 0
    get:
      security:
        - basicAuth: []
      tags: [Tutores]
      summary: Consulta la ficha de un tutor
      description: Una ficha de otro centro se responde como no encontrada.
      operationId: getReceptionTutor
      responses:
        '200':
          description: Ficha del tutor. ETag permite detectar cambios desde la lectura.
          headers:
            ETag:
              description: Versión calculada con los datos actuales de la ficha.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TutorDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      security:
        - basicAuth: []
      tags: [Tutores]
      summary: Actualiza los datos permitidos de un tutor
      description: Requiere el ETag obtenido al consultar la ficha. Las coincidencias de contacto pueden confirmarse explícitamente.
      operationId: updateReceptionTutor
      parameters:
        - in: header
          name: If-Match
          required: true
          description: ETag de la ficha leída antes de editar.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TutorUpdateRequestDto'
      responses:
        '200':
          description: Tutor actualizado. Devuelve el nuevo ETag.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TutorDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/recepcion/perros:
    get:
      security:
        - basicAuth: []
      tags: [Perros]
      summary: Busca perros del centro autorizado
      description: >
        Recepcionista, Admin y Gerente pueden buscar por nombre del perro o del tutor.
        La respuesta incluye el tutor solo cuando pertenece al mismo centro del perro.
      operationId: listReceptionDogs
      parameters:
        - in: query
          name: search
          required: false
          description: Texto opcional para buscar por perro o tutor.
          schema:
            type: string
            maxLength: 254
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: size
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - in: query
          name: reservationCandidates
          required: false
          description: Limita la búsqueda a perros activos con tutor del mismo centro.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Página ordenada por nombre e identificador.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DogPageDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      security:
        - basicAuth: []
      tags: [Perros]
      summary: Registra un perro asociado a un tutor existente
      description: >
        El centro se obtiene de la sesión. El tutor debe pertenecer a ese centro.
        Una coincidencia de nombre y tutor requiere confirmación explícita. No se
        crean tutores ni se modifican datos de cuidados.
      operationId: createReceptionDog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DogCreateRequestDto'
      responses:
        '201':
          description: Perro creado.
          headers:
            Location:
              description: Ruta de la ficha creada.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DogDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/recepcion/perros/{id}:
    parameters:
      - in: path
        name: id
        required: true
        description: Identificador del perro dentro del centro autorizado.
        schema:
          type: integer
          format: int64
          minimum: 0
    get:
      security:
        - basicAuth: []
      tags: [Perros]
      summary: Consulta la ficha de un perro
      description: >
        Devuelve los datos del perro y los nombres de las personas autorizadas de su tutor.
        Una ficha de otro centro se responde como no encontrada.
      operationId: getReceptionDog
      responses:
        '200':
          description: Ficha del perro y ETag para detectar cambios desde la lectura.
          headers:
            ETag:
              description: Versión calculada con los datos básicos editables y su tutor.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DogDetailDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      security:
        - basicAuth: []
      tags: [Perros]
      summary: Actualiza los datos básicos permitidos de un perro
      description: >
        Requiere el ETag obtenido al consultar la ficha. Tutor y centro no son
        editables. Los campos opcionales omitidos se conservan; para vaciarlos,
        usa clearBreed o clearBirthDate. Los demás campos de la entidad permanecen intactos.
      operationId: updateReceptionDog
      parameters:
        - in: header
          name: If-Match
          required: true
          description: ETag de la ficha leída antes de editar.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DogUpdateRequestDto'
      responses:
        '200':
          description: Perro actualizado. Devuelve el nuevo ETag.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DogDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/recepcion/grupos:
    get:
      security:
        - basicAuth: []
      tags: [Recepcion]
      summary: Lista los grupos disponibles para reserva
      description: >
        Recepcionista, Admin y Gerente pueden consultar grupos de su centro.
        No hay asignación automática; el grupo debe elegirse en el alta.
      operationId: listReceptionGroups
      responses:
        '200':
          description: Grupos ordenados por nombre, con su capacidad por franja.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReceptionGroupOptionDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/recepcion/disponibilidad:
    get:
      security:
        - basicAuth: []
      tags: [Recepcion]
      summary: Consulta disponibilidad informativa de un grupo
      description: >
        Devuelve plazas restantes por franja. El alta vuelve a comprobar el aforo
        de forma transaccional. Solo permite hoy o fechas futuras de lunes a sábado.
      operationId: getReceptionAvailability
      parameters:
        - in: query
          name: date
          required: true
          description: Fecha consultada en la zona horaria Europe/Madrid.
          schema:
            type: string
            format: date
            pattern: '^\d{4}-\d{2}-\d{2}$'
            example: '2026-11-18'
        - in: query
          name: groupId
          required: true
          description: Grupo del centro autorizado seleccionado por recepción.
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        '200':
          description: Capacidad, ocupación y plazas restantes por franja.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceptionAvailabilityDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/recepcion/reservas:
    get:
      security:
        - basicAuth: []
      tags: [Recepcion]
      summary: Lista reservas de una fecha para recepción
      description: >
        Solo Recepcionista, Admin y Gerente. El centro se obtiene del usuario autenticado;
        no se admite seleccionar otro centro. Si se omite la fecha, se usa hoy en Europe/Madrid.
        Incluye reservas canceladas y una situación de presencia calculada desde check_registro.
      operationId: listReceptionReservations
      parameters:
        - in: query
          name: date
          required: false
          description: Fecha consultada; por defecto, hoy en Europe/Madrid.
          schema:
            type: string
            format: date
            pattern: '^\d{4}-\d{2}-\d{2}$'
            example: '2026-11-17'
        - in: query
          name: page
          required: false
          description: Índice de página empezando en cero.
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: size
          required: false
          description: Número de resultados por página.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Página de reservas ordenada por nombre del perro e identificador.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceptionReservationPageDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      security:
        - basicAuth: []
      tags: [Recepcion]
      summary: Crea una reserva confirmada
      description: >
        Solo Recepcionista, Admin y Gerente. El centro y tutor se derivan del usuario
        y perro autenticados. Requiere un perro activo con tutor del centro y un grupo
        elegido expresamente. No acepta estado, bono, centro ni ocupación.
        La unicidad activa por perro/fecha y el aforo se validan dentro de una transacción.
      operationId: createReceptionReservation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReceptionReservationRequestDto'
      responses:
        '201':
          description: Reserva confirmada y persistida.
          headers:
            Location:
              description: Ruta del detalle de la reserva creada.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceptionBookingCreatedDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
