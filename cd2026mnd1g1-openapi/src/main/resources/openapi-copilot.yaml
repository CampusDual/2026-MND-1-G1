  /api/recepcion/reservas/{id}/entrada:
    post:
      security:
        - basicAuth: []
      tags: [Recepcion]
      summary: Registra la llegada de una reserva del día
      description: >
        Solo Recepcionista, Admin y Gerente. El centro, el usuario responsable, el tipo
        de registro y la hora se obtienen del contexto de servidor. Solo acepta reservas
        confirmadas de hoy sin entrada ni salida previas; el estado pasa a EN_CURSO.
        Observaciones y pertenencias se guardan como texto en un único campo. La operación
        es transaccional y solo admite una entrada y una salida por reserva.
      operationId: registerReceptionArrival
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
            minimum: 0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReceptionArrivalRequestDto'
      responses:
        '201':
          description: Entrada persistida con hora del servidor y estado actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckRecordDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/recepcion/reservas/{id}/datos-salida:
    get:
      security:
        - basicAuth: []
      tags: [Recepcion]
      summary: Consulta datos y autorizaciones para preparar una salida
      description: >
        Solo Recepcionista, Admin y Gerente del centro de la reserva. Devuelve únicamente
        las personas autorizadas asociadas al tutor del perro; no crea ni modifica autorizaciones.
      operationId: getReceptionDepartureData
