openapi: 3.0.3
info:
  title: Skeleton Fullstack API (Copilot)
  version: 1.0.0
  description: >
    Especificacion OpenAPI mantenida manualmente para la gestion de usuarios y la
    operativa diaria de la guarderia. Los usuarios operativos se autentican con su
    email y contraseña; se conserva el usuario legado admin para pruebas.
servers:
  - url: http://localhost:8080
security:
  - basicAuth: []
tags:
  - name: Users
    description: Operaciones de gestion de usuarios.
  - name: Operativa diaria
    description: Consultas y registros diarios de reservas.
paths:
  /api/reservas:
    get:
      security:
        - basicAuth: []
      tags: [Operativa diaria]
      summary: Lista las reservas de una fecha
      description: >
        Devuelve solo reservas del centro asociado al email del usuario autenticado.
        Si no se indica fecha, se usa la fecha actual.
      operationId: listDailyReservations
      parameters:
        - in: query
          name: date
          required: false
          description: Fecha de las reservas; por defecto, hoy.
          schema:
            type: string
            format: date
            example: '2026-11-17'
        - in: query
          name: groupId
          required: false
          description: Filtra las reservas por identificador de grupo.
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Reservas con ficha del perro, alergias, medicación, incompatibilidades y ocupación.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReservationDayDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/reservas/{id}/check-registros:
    parameters:
      - in: path
        name: id
        required: true
        description: Identificador de la reserva.
        schema:
          type: integer
          format: int64
          minimum: 1
    post:
      security:
        - basicAuth: []
      tags: [Operativa diaria]
      summary: Registra la entrada o salida de una reserva
      operationId: createCheckRecord
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckRecordRequestDto'
      responses:
        '201':
          description: Registro de entrada o salida creado; se devuelve el nuevo estado de la reserva.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckRecordDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/reservas/{id}/registros-diarios:
    parameters:
      - in: path
        name: id
        required: true
        description: Identificador de la reserva.
        schema:
          type: integer
          format: int64
          minimum: 1
    post:
      security:
        - basicAuth: []
      tags: [Operativa diaria]
      summary: Registra una actividad diaria
      operationId: createDailyRecord
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DailyRecordRequestDto'
      responses:
        '201':
          description: Registro diario creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyRecordDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/reservas/{id}/incidencias:
    parameters:
      - in: path
        name: id
        required: true
        description: Identificador de la reserva.
        schema:
          type: integer
          format: int64
          minimum: 1
    post:
      security:
        - basicAuth: []
      tags: [Operativa diaria]
      summary: Registra una incidencia de una reserva
      operationId: createReservationIncident
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncidentRequestDto'
      responses:
        '201':
          description: Incidencia creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/users:
    get:
      tags: [Users]
      summary: Lista todos los usuarios
      operationId: listUsers
      responses:
        '200':
          description: Lista de usuarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Users]
      summary: Crea un usuario
      operationId: createUser
      security:
        - basicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpsertRequestDto'
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/users/{id}:
    parameters:
      - in: path
        name: id
        required: true
        description: Identificador numerico del usuario.
        schema:
          type: integer
          format: int64
          minimum: 1
    get:
      tags: [Users]
      summary: Obtiene un usuario por id
      operationId: getUserById
      responses:
        '200':
          description: Usuario encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [Users]
      summary: Actualiza un usuario existente
      operationId: updateUser
      security:
        - basicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpsertRequestDto'
      responses:
        '200':
          description: Usuario actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Users]
      summary: Elimina un usuario
      operationId: deleteUser
      security:
        - basicAuth: []
      responses:
        '204':
          description: Usuario eliminado correctamente
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
  responses:
    BadRequest:
      description: Solicitud invalida por datos o formato incorrecto.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Credenciales ausentes o invalidas.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: El usuario autenticado no dispone de permisos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Recurso solicitado no encontrado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflicto de negocio (estado incompatible o recurso duplicado).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: Error de validacion semantica en la solicitud.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Error interno no controlado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ReservationDayDto:
      type: object
      required: [id, date, modality, status, dog]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        date:
          type: string
          format: date
        modality:
          type: string
          enum: [DIA_COMPLETO, MEDIA_JORNADA]
        status:
          type: string
          enum: [PENDIENTE, CONFIRMADA, EN_CURSO, COMPLETADA, CANCELADA]
        dog:
          $ref: '#/components/schemas/DogDailyDto'
        groupOccupancy:
          allOf:
            - $ref: '#/components/schemas/GroupOccupancyDto'
          nullable: true
    DogDailyDto:
      type: object
      required: [id, name, size, allergies, medications, incompatibilities]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
          maxLength: 120
        breed:
          type: string
          maxLength: 120
          nullable: true
        size:
          type: string
          enum: [PEQUENO, MEDIANO, GRANDE]
        birthDate:
          type: string
          format: date
          nullable: true
        allergies:
          type: array
          items:
            $ref: '#/components/schemas/AllergyDto'
        medications:
          type: array
          items:
            $ref: '#/components/schemas/MedicationDto'
        incompatibilities:
          type: array
          items:
            $ref: '#/components/schemas/IncompatibilityDto'
    AllergyDto:
      type: object
      required: [id, description]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        description:
          type: string
          maxLength: 1000
    MedicationDto:
      type: object
      required: [id, medication, instructions]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        medication:
          type: string
          maxLength: 160
        dosage:
          type: string
          maxLength: 255
          nullable: true
        instructions:
          type: string
          maxLength: 1000
    IncompatibilityDto:
      type: object
      required: [id, incompatibleDogId, incompatibleDogName]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        incompatibleDogId:
          type: integer
          format: int64
          minimum: 1
        incompatibleDogName:
          type: string
          maxLength: 120
        reason:
          type: string
          maxLength: 1000
          nullable: true
    GroupOccupancyDto:
      type: object
      required: [groupId, occupied, capacityMax]
      properties:
        groupId:
          type: integer
          format: int64
          minimum: 1
        occupied:
          type: integer
          format: int64
          minimum: 0
          description: Reservas del grupo y fecha cuyo estado no es CANCELADA.
        capacityMax:
          type: integer
          minimum: 1
    CheckRecordRequestDto:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [ENTRADA, SALIDA]
        petCondition:
          type: string
          maxLength: 500
          nullable: true
        observations:
          type: string
          maxLength: 2000
          nullable: true
          description: Artículos o indicaciones que deja el tutor.
    CheckRecordDto:
      type: object
      required: [id, reservationId, type, dateTime, reservationStatus]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        reservationId:
          type: integer
          format: int64
          minimum: 1
        type:
          type: string
          enum: [ENTRADA, SALIDA]
        dateTime:
          type: string
          format: date-time
        petCondition:
          type: string
          maxLength: 500
          nullable: true
        observations:
          type: string
          maxLength: 2000
          nullable: true
        reservationStatus:
          type: string
          enum: [PENDIENTE, CONFIRMADA, EN_CURSO, COMPLETADA, CANCELADA]
    DailyRecordRequestDto:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [COMIDA, PASEO, JUEGO, DESCANSO, OTRO]
        notes:
          type: string
          maxLength: 2000
          nullable: true
    DailyRecordDto:
      type: object
      required: [id, reservationId, type, dateTime]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        reservationId:
          type: integer
          format: int64
          minimum: 1
        type:
          type: string
          enum: [COMIDA, PASEO, JUEGO, DESCANSO, OTRO]
        dateTime:
          type: string
          format: date-time
        notes:
          type: string
          maxLength: 2000
          nullable: true
    IncidentRequestDto:
      type: object
      required: [severity, description]
      properties:
        severity:
          type: string
          enum: [LEVE, MODERADA, GRAVE]
        description:
          type: string
          minLength: 1
          maxLength: 2000
    IncidentDto:
      type: object
      required: [id, reservationId, severity, description, dateTime]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        reservationId:
          type: integer
          format: int64
          minimum: 1
        severity:
          type: string
          enum: [LEVE, MODERADA, GRAVE]
        description:
          type: string
          maxLength: 2000
        dateTime:
          type: string
          format: date-time
    UserDto:
      type: object
      required:
        - id
        - username
        - enabled
        - roles
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          example: 1
        username:
          type: string
          minLength: 1
          maxLength: 80
          example: admin
        enabled:
          type: boolean
          example: true
        roles:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: string
            minLength: 1
            maxLength: 80
            example: ROLE_ADMIN
    UserUpsertRequestDto:
      type: object
      required:
        - username
        - centerId
        - firstName
        - lastName
        - nationalId
        - email
        - password
        - enabled
        - roles
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 80
          description: Nombre de usuario. Se normaliza internamente a minusculas.
          example: manager
        centerId:
          type: integer
          format: int64
          minimum: 1
          description: Identificador del centro asociado.
        firstName:
          type: string
          minLength: 1
          maxLength: 120
        lastName:
          type: string
          minLength: 1
          maxLength: 160
        nationalId:
          type: string
          minLength: 1
          maxLength: 20
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 120
          format: password
          example: securePass123
        enabled:
          type: boolean
          example: true
        roles:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: string
            minLength: 1
            maxLength: 80
            description: Rol único del usuario; si lleva prefijo ROLE_ se elimina antes de almacenarlo.
            example: ADMIN
    ValidationErrorItem:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
          example: username
        message:
          type: string
          example: El nombre de usuario es obligatorio
    ErrorResponse:
      type: object
      required:
        - timestamp
        - status
        - error
        - message
      properties:
        timestamp:
          type: string
          format: date-time
          example: '2026-09-25T08:20:58Z'
        status:
          type: integer
          format: int32
          minimum: 100
          maximum: 599
          example: 400
        error:
          type: string
          example: Bad Request
        message:
          type: string
          example: El id debe ser mayor que cero
        errors:
          type: array
          description: Detalle opcional de errores de validacion por campo.
          items:
            $ref: '#/components/schemas/ValidationErrorItem'
