  /api/recepcion/reservas/{id}/salida:
    post:
      security:
        - basicAuth: []
      tags: [Recepcion]
      summary: Registra la salida y el destinatario de la entrega
      description: >
        Solo Recepcionista, Admin y Gerente del centro. Requiere una entrada válida,
        estancia EN_CURSO y ausencia de salida previa. La autorización se revalida en servidor
        y la operación bloquea la reserva y se ejecuta en una transacción. Las observaciones
        son opcionales, independientes de la gestión de pertenencias y se guardan como texto libre.
        Las estancias abiertas antiguas se cierran con la hora actual del servidor.
      operationId: registerReceptionDeparture
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
            minimum: 0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterReceptionDepartureRequestDto'
      responses:
        '201':
          description: Salida persistida con hora, responsable y destinatario históricos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckRecordDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
