        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        '200':
          description: Información mínima de la estancia y personas autorizadas registradas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceptionDepartureDataDto'
        '400':
