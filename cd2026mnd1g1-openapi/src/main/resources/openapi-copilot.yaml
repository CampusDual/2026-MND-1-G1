components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
  responses:
    BadRequest:
      description: Solicitud invalida por datos o formato incorrecto.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Credenciales ausentes o invalidas.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: El usuario autenticado no dispone de permisos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Recurso solicitado no encontrado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflicto de negocio (estado incompatible o recurso duplicado).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: Error de validacion semantica en la solicitud.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLarge:
      description: La carga supera el límite configurado para la foto.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Error interno no controlado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    TutorDogPageDto:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TutorDogSummaryDto'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    TutorDogSummaryDto:
      type: object
      required: [id, name, size, photoAvailable]
      properties:
        id:
          type: integer
          format: int64
          minimum: 0
        name:
          type: string
          minLength: 1
          maxLength: 120
        breed:
          type: string
          nullable: true
          maxLength: 120
        size:
          type: string
          enum: [PEQUENO, MEDIANO, GRANDE]
        photoAvailable:
          type: boolean
          description: Hay una referencia de foto; su acceso se autoriza en un endpoint privado.
    TutorDogDetailDto:
      type: object
      required: [id, name, size, photoAvailable, allergies, medications, authorizedPersons]
      properties:
        id:
          type: integer
          format: int64
          minimum: 0
        name:
          type: string
          minLength: 1
          maxLength: 120
        breed:
          type: string
          nullable: true
          maxLength: 120
        size:
          type: string
          enum: [PEQUENO, MEDIANO, GRANDE]
        birthDate:
          type: string
          format: date
          nullable: true
        photoAvailable:
          type: boolean
        feedingInstructions:
          type: string
          nullable: true
          maxLength: 1000
          description: Pauta de consulta; solo el centro puede actualizarla.
        feedingDeclaredByTutor:
          type: boolean
          description: Procedencia histórica del valor; no habilita su edición por el tutor.
        allergies:
          type: array
          description: Lista de descripciones registradas; una lista vacía no afirma que no existan alergias.
          items:
            $ref: '#/components/schemas/TutorDogAllergyDto'
        medications:
          type: array
          description: Pautas registradas, no dosis administradas ni tratamientos activos.
          items:
            $ref: '#/components/schemas/TutorMedicationDto'
        authorizedPersons:
          type: array
          description: Autorizaciones generales del tutor, no exclusivas de este perro.
          items:
            $ref: '#/components/schemas/TutorAuthorizedPersonDto'
    TutorDogCreateRequestDto:
      type: object
      required: [name, size]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        breed:
          type: string
          nullable: true
          maxLength: 120
        size:
          type: string
          enum: [PEQUENO, MEDIANO, GRANDE]
        birthDate:
          type: string
          format: date
          nullable: true
          description: No puede ser posterior a la fecha actual del centro.
        allergies:
          type: array
          items:
            $ref: '#/components/schemas/TutorDogAllergyInputDto'
        medications:
          type: array
          description: Datos declarados; no se consideran revisados ni administrados.
          items:
            $ref: '#/components/schemas/TutorDogMedicationInputDto'
        authorizedPersons:
          type: array
          description: Nuevas personas autorizadas generales; filas vacías se omiten.
          items:
            $ref: '#/components/schemas/TutorDogAuthorizedPersonInputDto'
    TutorDogUpdateRequestDto:
      type: object
      required: [name, size, allergies, medications, authorizedPersons, removePhoto]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        breed:
          type: string
          nullable: true
          maxLength: 120
        size:
          type: string
          enum: [PEQUENO, MEDIANO, GRANDE]
        birthDate:
          type: string
          format: date
          nullable: true
          description: No puede ser posterior a la fecha actual del centro.
        allergies:
          type: array
          description: Reemplaza únicamente las alergias declaradas por el tutor; las del centro se conservan.
          items:
            $ref: '#/components/schemas/TutorDogAllergyInputDto'
        medications:
          type: array
          description: Reemplaza únicamente las pautas declaradas por el tutor; las del centro se conservan.
          items:
            $ref: '#/components/schemas/TutorDogMedicationInputDto'
        authorizedPersons:
          type: array
          description: Conjunto completo de autorizaciones generales; IDs existentes se actualizan, nuevas filas se crean y las omitidas se revocan.
          items:
            $ref: '#/components/schemas/TutorDogAuthorizedPersonEditInputDto'
        removePhoto:
          type: boolean
          description: Retira la foto actual; no puede combinarse con el envío de otra foto.
    TutorDogAllergyDto:
      type: object
      required: [description, declaredByTutor]
      properties:
        description:
          type: string
