spring:
  application:
    name: cd2026mnd1g1
  datasource:
    url: jdbc:hsqldb:mem:appdb;sql.syntax_pgs=true
    username: sa
    password:
    driver-class-name: org.hsqldb.jdbc.JDBCDriver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
springdoc:
  paths-to-match: /api/**
  swagger-ui:
    urls:
      - name: "1. Automática (springdocs)"
        url: "/v3/api-docs"
      - name: "2. Manual (Copilot)"
        url: "/openapi-copilot.yaml"
app:
  dogs:
    photos:
      directory: ${DOG_PHOTOS_DIR:${user.home}/.cd2026mnd1g1/dog-photos}
